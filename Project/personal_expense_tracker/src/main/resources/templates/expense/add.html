<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="#{label.add.edit}">
        Label Add/Edit
    </title>
</head>

<body>

<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container has-text-centered">

    <!-- Add or Edit heading -->
    <h2 class="title is-2"
        th:if="${expense.id != null}"
        th:text="#{label.edit.order}">
        Edit Expense
    </h2>

    <h2 class="title is-2"
        th:if="${expense.id == null}"
        th:text="#{label.add.order}">
        Add Expense
    </h2>

    <form th:object="${expense}"
          th:action="@{/expense/submit}"
          method="post"
          class="wbb"
          style="display:inline-block;text-align:left!important">

        <!-- Hidden ID field -->
        <input type="hidden" th:field="*{id}" />


        <!-- Expense Date -->
        <p>
            <label for="expenseDate">Expense Date:</label>
            <input type="date" th:field="*{expenseDate}"
                   id="expenseDate" />
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('expenseDate')}"
           th:errors="*{expenseDate}"></p>

        <!-- Description -->
        <p>
            <label for="description">Description:</label>
            <input type="text" th:field="*{description}"
                   id="description" />
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('description')}"
           th:errors="*{description}"></p>

        <!-- Category -->
        <p>
            <label for="category">Category:</label>
            <select th:field="*{category}" id="category">
                <option value="">-- Select Category --</option>
                <option value="Groceries">Groceries</option>
                <option value="Dining Out">Dining Out</option>
                <option value="Transportation">Transportation</option>
                <option value="Housing/Utilities">Housing/Utilities</option>
                <option value="School">School</option>
                <option value="Personal">Personal</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('category')}"
           th:errors="*{category}"></p>

        <!-- Amount -->
        <p>
            <label for="amount">Amount ($):</label>
            <input type="number" step="0.01" th:field="*{amount}"
                   id="amount" />
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('amount')}"
           th:errors="*{amount}"></p>

        <!-- Payment Method -->
        <p>
            <label for="paymentMethod">Payment Method:</label>
            <select th:field="*{paymentMethod}" id="paymentMethod">
                <option value="">-- Select Payment Method --</option>
                <option value="Cash">Cash</option>
                <option value="Debit">Debit</option>
                <option value="Credit Card">Credit Card</option>
                <option value="e-Transfer">e-Transfer</option>
                <option value="Pre-authorized">Pre-authorized</option>
            </select>
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('paymentMethod')}"
           th:errors="*{paymentMethod}"></p>

        <!-- Is Recurring -->
        <p>
            <label for="isRecurring">Recurring Expense:</label>
            <input type="checkbox" th:field="*{isRecurring}"
                   id="isRecurring" />
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('isRecurring')}"
           th:errors="*{isRecurring}"></p>

        <!-- Is Essential -->
        <p>
            <label for="isEssential">Essential (Need):</label>
            <input type="checkbox" th:field="*{isEssential}"
                   id="isEssential" />
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('isEssential')}"
           th:errors="*{isEssential}"></p>

        <!-- Notes -->
        <p>
            <label for="notes">Notes (Optional):</label>
            <input type="text" th:field="*{notes}"
                   id="notes" />
        </p>
        <p class="cd"
           th:if="${#fields.hasErrors('notes')}"
           th:errors="*{notes}"></p>

        <!-- Submit button -->
        <button type="submit"
                style="display:block;margin-top:24px!important"
                class="centered"
                th:text="#{label.submit}">
            Submit
        </button>

    </form>

</div>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
