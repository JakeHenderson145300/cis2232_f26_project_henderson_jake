<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head">
    <title id="pageTitle" th:text="${session.title}">Expense List</title>
</head>

<body>

<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container my-4">

    <h2 class="mb-3 text-center title">PocketLedger - Expense List</h2>

    <!-- Error message -->
    <h2 class="mb-3 text-center error"
        th:if="${not #strings.isEmpty(messageError)}"
        th:text="${messageError}">
        Message from controller
    </h2>

    <!-- Success message -->
    <h2 class="mb-3 text-center success"
        th:if="${not #strings.isEmpty(messageSuccess)}"
        th:text="${messageSuccess}">
        Message success from controller
    </h2>

    <div class="table-responsive">

        <table id="theData"
               class="table table-striped table-hover align-middle">

            <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Expense Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Payment Method</th>
                <th>Recurring</th>
                <th>Essential</th>
                <th>Notes</th>
                <th>Remaining Budget</th>
                <th>Options</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="current : ${expenses}">

                <td th:text="${current.id}"></td>
                <td th:text="${current.expenseDate}"></td>
                <td th:text="${current.description}"></td>
                <td class="text-center" th:text="${current.category}"></td>
                <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(current.amount, 1, 2)}"></td>
                <td class="text-center" th:text="${current.paymentMethod}"></td>
                <td class="text-center" th:text="${current.isRecurring ? 'Yes' : 'No'}"></td>
                <td class="text-center" th:text="${current.isEssential ? 'Yes' : 'No'}"></td>
                <td th:text="${current.notes}"></td>
                <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(current.remainingBudget, 1, 2)}"></td>

                <td class="text-center">
                    <div class="btn-group" role="group">

                        <!-- Edit expense -->
                        <a th:href="@{/expense/edit/{id}(id=${current.id})}"
                           class="btn btn-sm btn-outline-primary"
                           title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>

                        <!-- Delete expense -->
                        <a th:href="@{/expense/delete/{id}(id=${current.id})}"
                           class="btn btn-sm btn-outline-danger"
                           title="Delete"
                           onclick="return confirm('Are you sure you want to delete this expense?');">
                            <i class="fas fa-trash"></i>
                        </a>

                    </div>
                </td>

            </tr>

            <!-- Message when no data exists -->
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="11"
                    class="text-center text-muted py-4">
                    No expenses found.
                </td>
            </tr>

            </tbody>

        </table>

    </div>

    <!-- Add new expense button -->
    <div class="text-center mt-3">
        <a th:href="@{/expense/add}"
           href="/expense/add"
           class="accent accent-background btn btn-success">

            <i class="fas fa-plus"></i>
            Add New Expense

        </a>
    </div>

</div>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
